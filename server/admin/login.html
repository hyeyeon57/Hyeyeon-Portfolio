<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jang hyeyeon · 관리자 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif !important;
      background: #F2F5F9 !important;
      min-height: 100vh !important;
    }
    .login-card {
      background: #FFFFFF !important;
      border-radius: 12px !important;
      border: 1px solid #E2E8F0 !important;
      padding: 40px 36px !important;
      box-shadow: 0 12px 32px rgba(27, 54, 93, 0.08) !important;
    }
    .login-input {
      width: 100%;
      padding: 12px 16px !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 8px !important;
      background: #FFFFFF !important;
      color: #1E293B !important;
      font-size: 15px !important;
      transition: border-color 0.2s ease !important;
    }
    .login-input:focus {
      border-color: #1B365D !important;
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(27, 54, 93, 0.12) !important;
    }
    /* 브라우저 자동완성(Chrome/Edge) 하늘색·보라빛 배경 제거 → 흰색 유지 */
    .login-input:-webkit-autofill,
    .login-input:-webkit-autofill:hover,
    .login-input:-webkit-autofill:focus,
    .login-input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #FFFFFF inset !important;
      box-shadow: 0 0 0 1000px #FFFFFF inset !important;
      -webkit-text-fill-color: #1E293B !important;
      caret-color: #1E293B !important;
      transition: background-color 9999s ease-in-out 0s;
    }
    /* 비밀번호 보기/숨기기 아이콘: 남색 고정 */
    .pw-toggle-btn {
      color: #1B365D !important;
    }
    .pw-toggle-btn:hover,
    .pw-toggle-btn:focus-visible {
      color: #142A4A !important;
    }
    .pw-toggle-btn svg {
      color: inherit !important;
      stroke: currentColor !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-4">
    <!-- 로그인 카드 (프론트엔드 에디토리얼 톤) -->
    <div class="login-card">
      <div class="text-center mb-8">
        <p style="font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #1B365D; margin-bottom: 8px;">BACK OFFICE</p>
        <h1 style="font-family: 'Gelasio', Georgia, serif; font-size: 32px; color: #111111; margin-bottom: 6px;">Jang hyeyeon</h1>
        <p style="font-size: 14px; color: #767676;">포트폴리오 관리자 로그인</p>
      </div>

      <form id="loginForm" class="space-y-5" method="post" action="/admin/login">
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color: #333333;">아이디</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            class="login-input"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
          />
        </div>
        
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color: #333333;">비밀번호</label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              class="login-input"
              placeholder="비밀번호를 입력하세요"
              autocomplete="current-password"
            />
            <button 
              type="button" 
              onclick="togglePassword()" 
              class="pw-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 transition"
              style="color: #1B365D;"
              aria-label="비밀번호 보기/숨기기"
            >
              <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
          아이디 또는 비밀번호가 올바르지 않습니다.
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full text-white py-3.5 rounded-lg transition font-semibold flex items-center justify-center gap-2"
          style="background-color: #1B365D;"
          onmouseover="this.style.backgroundColor='#132846'"
          onmouseout="this.style.backgroundColor='#1B365D'"
        >
          <i data-lucide="log-in" class="w-4 h-4"></i>
          로그인
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="http://localhost:3000" class="text-sm text-[#767676] transition-colors flex items-center justify-center gap-2 hover:text-[#111111]">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          포트폴리오로 돌아가기
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-gray-500">
      <p>© 2025 Jang Haeyeon Portfolio</p>
    </div>
  </div>

  <script>
    // lucide 로드 보장
    function ensureLucide() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
        return;
      }
      // fallback: 스크립트가 로드되지 않았다면 다시 로드 시도
      const existing = document.querySelector('script[data-lucide-fallback]');
      if (!existing) {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/lucide@latest/dist/umd/lucide.js';
        script.defer = true;
        script.setAttribute('data-lucide-fallback', 'true');
        script.onload = () => window.lucide && window.lucide.createIcons && window.lucide.createIcons();
        document.head.appendChild(script);
      }
    }
    ensureLucide();

    // 비밀번호 보기/숨기기
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.pw-toggle-btn');
      const showing = passwordInput.type === 'password';
      passwordInput.type = showing ? 'text' : 'password';
      // lucide가 <i>를 <svg>로 바꾸므로, 매번 버튼 내부를 새로 그려서 아이콘을 갱신
      if (toggleBtn) {
        toggleBtn.innerHTML = `<i data-lucide="${showing ? 'eye-off' : 'eye'}" id="eyeIcon" class="w-5 h-5"></i>`;
      }
      ensureLucide();
    }

    // 로그인 폼 제출
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const errorMessage = document.getElementById('errorMessage');
      
      // 에러 메시지 숨기기
      errorMessage.classList.add('hidden');
      
      // 버튼 비활성화
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> 로그인 중...';
      
      try {
        // 같은 오리진을 사용하여 세션 쿠키가 제대로 전달되도록 함
        // Next.js API 라우트(/bo-api)가 Express 서버로 프록시함
        const API_URL = '/bo-api';
        const loginUrl = `${API_URL}/auth/login`;
        console.log('🔐 로그인 요청:', { loginUrl, username, origin: window.location.origin });
        
        const response = await fetch(loginUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include', // 쿠키 포함
          body: JSON.stringify({ username, password })
        });
        
        console.log('📡 로그인 응답:', { 
          status: response.status, 
          statusText: response.statusText,
          ok: response.ok,
          headers: Object.fromEntries(response.headers.entries())
        });
        
        // 응답이 JSON이 아닐 수 있으므로 확인
        let result;
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('application/json')) {
          result = await response.json();
        } else {
          const text = await response.text();
          console.error('❌ JSON이 아닌 응답:', text);
          throw new Error(`서버 오류 (${response.status}): ${text.substring(0, 100)}`);
        }
        
        console.log('📋 로그인 결과:', result);
        
        if (result.success) {
          // 로그인 성공 - 관리자 페이지로 이동
          console.log('✅ 로그인 성공, 리다이렉트 중...');
          window.location.href = '/admin';
        } else {
          // 로그인 실패
          errorMessage.textContent = result.error || '아이디 또는 비밀번호가 올바르지 않습니다.';
          errorMessage.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> 로그인';
          ensureLucide();
        }
      } catch (error) {
        console.error('❌ 로그인 오류:', error);
        let errorText = '로그인 중 오류가 발생했습니다.';
        
        if (error.message) {
          if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
            errorText = '백엔드 서버에 연결할 수 없습니다. 서버가 실행 중인지 확인하세요.';
          } else if (error.message.includes('서버 오류')) {
            errorText = error.message;
          } else {
            errorText = `오류: ${error.message}`;
          }
        }
        
        errorMessage.textContent = errorText;
        errorMessage.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> 로그인';
        ensureLucide();
      }
    });

    // Enter 키로 로그인
    document.getElementById('username').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('password').focus();
      }
    });
    
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
