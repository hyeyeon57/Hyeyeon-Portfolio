<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 프로젝트 만들기</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50">
  <div id="app">
    <!-- 헤더 -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-40">
      <div class="max-w-4xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center">
          <div>
            <h1 class="text-3xl font-bold text-gray-900">새 프로젝트 만들기</h1>
            <p class="text-gray-500 mt-1">프로젝트 정보를 입력하세요</p>
          </div>
          <div class="flex gap-3">
            <a href="/admin" class="px-4 py-2 rounded-lg transition flex items-center gap-2" style="background-color: #E8E4FF; color: #7A68F6;" onmouseover="this.style.backgroundColor='#D8D0FF'" onmouseout="this.style.backgroundColor='#E8E4FF'">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              돌아가기
            </a>
            <button onclick="logout()" class="px-4 py-2 rounded-lg transition flex items-center gap-2" style="background-color: #E8E4FF; color: #7A68F6;" onmouseover="this.style.backgroundColor='#D8D0FF'" onmouseout="this.style.backgroundColor='#E8E4FF'">
              <i data-lucide="log-out" class="w-4 h-4"></i>
              로그아웃
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 폼 -->
    <div class="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
      <form id="projectForm" class="bg-white rounded-xl shadow-sm border p-8 space-y-6">
        <!-- 제목 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            제목 <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            name="title"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            placeholder="프로젝트 제목을 입력하세요"
          />
        </div>

        <!-- 부제목 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">부제목</label>
          <input
            type="text"
            name="subtitle"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            placeholder="부제목을 입력하세요"
          />
        </div>

        <!-- 설명 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            설명 (짧은 설명) <span class="text-red-500">*</span>
          </label>
          <textarea
            name="description"
            required
            rows="3"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            placeholder="프로젝트 짧은 설명을 입력하세요"
          ></textarea>
        </div>

        <!-- 상세 설명 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">상세 설명</label>
          <textarea
            name="fullDescription"
            rows="5"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            placeholder="프로젝트 상세 설명을 입력하세요"
          ></textarea>
        </div>

        <!-- 카테고리와 태그 -->
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              카테고리 <span class="text-red-500">*</span>
            </label>
            <select
              name="category"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            >
              <option value="">선택하세요</option>
              <option value="new">신규</option>
              <option value="renewal">리뉴얼</option>
              <option value="app">앱</option>
              <option value="web">웹</option>
              <option value="proposal">기획안</option>
              <option value="usability">사용성평가</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">태그 (쉼표로 구분)</label>
            <input
              type="text"
              name="tags"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="UX 디자인, 사용성 평가, 기획"
            />
          </div>
        </div>

        <!-- 날짜, 팀, 기간 -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">팀 구성</label>
            <input
              type="text"
              name="team"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="1인"
            />
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">시작일</label>
              <input
                type="date"
                name="startDate"
                id="startDate"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">종료일</label>
              <input
                type="date"
                name="endDate"
                id="endDate"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">기간 (자동 계산)</label>
            <input
              type="text"
              name="duration"
              id="duration"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50"
              placeholder="날짜를 선택하면 자동 계산됩니다"
              readonly
            />
          </div>
        </div>

        <!-- 역할과 링크 -->
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">역할</label>
            <input
              type="text"
              name="role"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="기획자"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">링크 (선택)</label>
            <input
              type="text"
              name="link"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="https://..."
            />
          </div>
        </div>

        <!-- 대표 이미지 (1개) -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">대표 이미지 (1개)</label>
          <input type="file" accept="image/png, image/jpeg" id="mainImageFile" class="text-sm" />
          <div id="mainImageStatus" class="text-sm text-gray-600"></div>
          <input type="hidden" name="image" id="mainImage" />
        </div>

        <!-- 갤러리 이미지 (여러 개) -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">갤러리 이미지 (여러 개 업로드 가능)</label>
          <input type="file" accept="image/png, image/jpeg" id="galleryImagesFile" class="text-sm" multiple />
          <div id="galleryImagesStatus" class="text-sm text-gray-600 space-y-1"></div>
          <input type="hidden" name="gallery" id="galleryImages" />
        </div>

        <!-- PDF 업로드 -->
        <div class="space-y-4 border rounded-lg p-4 bg-gray-50">
          <div class="flex items-center gap-2">
            <i data-lucide="file-text" class="w-4 h-4 text-gray-600"></i>
            <h3 class="text-lg font-semibold text-gray-800">PDF 업로드</h3>
            <span class="text-sm text-gray-500">(업로드 후 URL 자동 저장)</span>
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">화면 설계서 PDF</label>
            <div class="flex items-center gap-3 flex-wrap">
              <input type="file" accept="application/pdf" id="designPdfFile" class="text-sm" />
              <button type="button" onclick="uploadPdf('design')" class="px-3 py-2 text-white rounded text-sm" style="background-color: #7A68F6;" onmouseover="this.style.backgroundColor='#6B5AE5'" onmouseout="this.style.backgroundColor='#7A68F6'">
                업로드
              </button>
              <span id="designPdfStatus" class="text-sm text-gray-600"></span>
            </div>
            <input type="hidden" name="designPdf" id="designPdf" />
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">프로젝트 상세보기 PDF</label>
            <div class="flex items-center gap-3 flex-wrap">
              <input type="file" accept="application/pdf" id="detailPdfFile" class="text-sm" />
              <button type="button" onclick="uploadPdf('detail')" class="px-3 py-2 text-white rounded text-sm" style="background-color: #7A68F6;" onmouseover="this.style.backgroundColor='#6B5AE5'" onmouseout="this.style.backgroundColor='#7A68F6'">
                업로드
              </button>
              <span id="detailPdfStatus" class="text-sm text-gray-600"></span>
            </div>
            <input type="hidden" name="detailPdf" id="detailPdf" />
          </div>

        </div>

        <!-- 주요 성과 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">주요 성과 (줄바꿈으로 구분)</label>
          <textarea
            name="achievements"
            rows="5"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            placeholder="주요 성과를 한 줄씩 입력하세요&#10;예: 사용자 만족도 20% 향상&#10;예: 예매 단계 7→4단계 축소"
          ></textarea>
          <p class="text-xs text-gray-500 mt-1">각 성과를 줄바꿈으로 구분하여 입력하세요</p>
        </div>

        <!-- 대표 프로젝트 -->
        <div>
          <label class="flex items-center">
            <input
              type="checkbox"
              name="featured"
              class="w-4 h-4 border-gray-300 rounded"
              style="color: #7A68F6; accent-color: #7A68F6;"
              onfocus="this.style.outlineColor='#7A68F6'"
            />
            <i data-lucide="pin" class="w-4 h-4 ml-2" style="color: #7A68F6;" fill="currentColor"></i>
            <span class="ml-2 text-sm text-gray-700">대표 프로젝트로 고정</span>
          </label>
        </div>

        <!-- 제출 버튼 -->
        <div class="flex gap-4 pt-4">
          <button
            type="submit"
            id="submitBtn"
            class="flex-1 text-white py-3 rounded-lg transition disabled:bg-gray-400 disabled:cursor-not-allowed font-medium"
            style="background-color: #7A68F6;"
            onmouseover="if(!this.disabled) this.style.backgroundColor='#6B5AE5'"
            onmouseout="if(!this.disabled) this.style.backgroundColor='#7A68F6'"
          >
            ✅ 프로젝트 생성
          </button>
          <a
            href="/admin"
            class="px-8 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-center flex items-center justify-center"
          >
            취소
          </a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 프로덕션에서는 같은 도메인의 /bo-api 경로 사용, 개발 환경에서는 별도 서버 사용
    // 포트 3000(Next.js)로 통합되었으므로 항상 /bo-api 사용
    const API_URL = '/bo-api';
    
    // 디버깅: 환경 정보 로그
    console.log('🔧 환경 설정:', {
      hostname: window.location.hostname,
      API_URL: API_URL,
      origin: window.location.origin
    });

    const computeDurationText = (start, end) => {
      if (!start || !end) return '';
      const s = new Date(start);
      const e = new Date(end);
      if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime()) || e < s) return '';
      let diffDays = Math.floor((e - s) / (1000 * 60 * 60 * 24));
      const years = Math.floor(diffDays / 365); diffDays %= 365;
      let months = Math.floor(diffDays / 30); diffDays %= 30;
      let weeks = Math.floor(diffDays / 7); diffDays %= 7;
      if (weeks >= 12) {
        months += Math.floor(weeks / 4);
        weeks = weeks % 4;
      }
      const parts = [];
      if (years > 0) {
        parts.push(`${years}년`);
        if (months > 0) parts.push(`${months}개월`);
      } else if (months > 0) {
        parts.push(`${months}개월`);
        if (weeks > 0) parts.push(`${weeks}주`);
      } else if (weeks > 0) {
        parts.push(`${weeks}주`);
        if (diffDays > 0) parts.push(`${diffDays}일`);
      } else if (diffDays > 0) {
        parts.push(`${diffDays}일`);
      }
      return parts.join(' ');
    };

    const startEl = document.getElementById('startDate');
    const endEl = document.getElementById('endDate');
    const durationEl = document.getElementById('duration');
    const updateDuration = () => {
      const dur = computeDurationText(startEl?.value, endEl?.value);
      if (durationEl) durationEl.value = dur || '';
    };
    if (startEl) startEl.addEventListener('change', () => {
      if (endEl && endEl.value && startEl.value && endEl.value < startEl.value) {
        endEl.value = '';
      }
      updateDuration();
    });
    if (endEl) endEl.addEventListener('change', () => {
      if (startEl && startEl.value && endEl.value && endEl.value < startEl.value) {
        startEl.value = '';
      }
      updateDuration();
    });
    updateDuration();

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '생성 중...';

      const fd = new FormData();
      const formEl = e.target;
      const formData = new FormData(formEl);

      const projectData = {
        title: formData.get('title'),
        subtitle: formData.get('subtitle') || '',
        description: formData.get('description'),
        fullDescription: formData.get('fullDescription') || formData.get('description') || '',
        category: formData.get('category'),
        tags: formData.get('tags') ? formData.get('tags').toString().split(',').map(tag => tag.trim()).filter(Boolean) : [],
        startDate: formData.get('startDate') || '',
        endDate: formData.get('endDate') || '',
        date: formData.get('startDate') && formData.get('endDate') ? `${formData.get('startDate')} ~ ${formData.get('endDate')}` : '',
        team: formData.get('team') || '',
        role: formData.get('role') || '',
        duration: formData.get('duration') || '',
        link: formData.get('link') || '',
        designPdf: formData.get('designPdf') || '',
        detailPdf: formData.get('detailPdf') || '',
        achievements: formData.get('achievements') ? formData.get('achievements').toString().split('\n').map(a => a.trim()).filter(Boolean) : [],
        featured: formData.get('featured') === 'on',
      };

      // 대표 이미지
      const mainImageFile = document.getElementById('mainImageFile').files?.[0];

      // 갤러리 이미지: 사용자 정의 배열(galleryFileList)의 순서를 그대로 사용
      const totalFiles = (mainImageFile ? 1 : 0) + (window.galleryFileList ? window.galleryFileList.length : 0);

      // 업로드 진행 상황 모달 표시
      if (totalFiles > 0) {
        showUploadProgress(totalFiles);
      }

      try {
        // S3 직접 업로드
        if (totalFiles > 0) {
          const filesToUpload = [];
          if (mainImageFile) filesToUpload.push(mainImageFile);
          if (window.galleryFileList && window.galleryFileList.length > 0) {
            filesToUpload.push(...window.galleryFileList);
          }

          const uploadedUrls = await uploadFilesToS3WithProgress(filesToUpload, 'projects');

          // 업로드된 URL을 projectData에 추가
          if (mainImageFile) {
            projectData.image = uploadedUrls[0];
            projectData.images = uploadedUrls.slice(1);
            projectData.gallery = uploadedUrls.slice(1);
          } else {
            projectData.images = uploadedUrls;
            projectData.gallery = uploadedUrls;
          }
        }

        // 프로젝트 생성 (이미지 URL만 전송)
        const response = await fetch(`${API_URL}/projects`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(projectData),
        });

        if (response.status === 401) {
          if (totalFiles > 0) hideUploadProgress();
          alert('인증이 필요합니다. 다시 로그인해주세요.');
          window.location.href = '/admin/login';
          return;
        }

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ error: '서버 오류가 발생했습니다.' }));
          throw new Error(errorData.error || `HTTP ${response.status}`);
        }

        const result = await response.json();

        if (result.success) {
          if (totalFiles > 0) {
            updateUploadProgress(totalFiles, totalFiles, 100, '업로드 완료!');
            setTimeout(() => {
              hideUploadProgress();
              alert('프로젝트가 생성되었습니다! ✅');
              window.location.href = '/admin';
            }, 500);
          } else {
            alert('프로젝트가 생성되었습니다! ✅');
            window.location.href = '/admin';
          }
        } else {
          if (totalFiles > 0) hideUploadProgress();
          alert(`프로젝트 생성에 실패했습니다: ${result.error || '알 수 없는 오류'}`);
          submitBtn.disabled = false;
          submitBtn.textContent = '✅ 프로젝트 생성';
        }
      } catch (error) {
        console.error('프로젝트 생성 오류:', error);
        if (totalFiles > 0) hideUploadProgress();
        alert(`오류가 발생했습니다: ${error.message || '알 수 없는 오류'}`);
        submitBtn.disabled = false;
        submitBtn.textContent = '✅ 프로젝트 생성';
      }
    });

    async function uploadPdf(kind) {
      const fileInput = document.getElementById(`${kind}PdfFile`);
      const statusEl = document.getElementById(`${kind}PdfStatus`);
      const hiddenInput = document.getElementById(`${kind}Pdf`);

      if (!fileInput.files?.length) {
        alert('PDF 파일을 선택해주세요.');
        return;
      }

      const file = fileInput.files[0];
      statusEl.textContent = '업로드 중...';

      try {
        const fd = new FormData();
        fd.append('file', file);

        const resp = await fetch(`${API_URL}/upload-pdf`, {
          method: 'POST',
          body: fd,
        });

        if (!resp.ok) {
          const text = await resp.text();
          throw new Error(text || '업로드 실패');
        }

        const result = await resp.json();
        if (!result.success) {
          throw new Error(result.error || '업로드 실패');
        }

        hiddenInput.value = result.path;
        statusEl.innerHTML = `<a href="${result.path}" target="_blank" class="underline text-sm" style="color: #7A68F6;">업로드 완료: ${result.filename}</a>`;
        fileInput.value = '';
      } catch (error) {
        console.error('PDF 업로드 오류:', error);
        statusEl.textContent = '업로드 실패: ' + (error?.message || '알 수 없는 오류');
      }
    }

    // 이미지 선택 상태 표시 (truncate)
    const truncate = (name, len = 40) => name.length > len ? name.slice(0, len) + '…' : name;
    const mainImageFile = document.getElementById('mainImageFile');
    const mainImageStatus = document.getElementById('mainImageStatus');
    if (mainImageFile && mainImageStatus) {
      mainImageFile.addEventListener('change', () => {
        if (mainImageFile.files?.length) {
          mainImageStatus.textContent = truncate(mainImageFile.files[0].name);
        } else {
          mainImageStatus.textContent = '';
        }
      });
    }
    // 갤러리 이미지 선택: 썸네일 + 파일명 + 드래그로 순서 변경 + 삭제
    const galleryImagesFile = document.getElementById('galleryImagesFile');
    const galleryImagesStatus = document.getElementById('galleryImagesStatus');
    window.galleryFileList = [];
    let draggedGalleryIndex = null;

    const refreshCreateGalleryStatus = () => {
      if (!galleryImagesStatus) return;

      galleryImagesStatus.innerHTML = window.galleryFileList.map((file, idx) => {
        const url = URL.createObjectURL(file);
        return `
          <div
            class="flex items-center gap-2 py-1 border border-gray-200 rounded-md px-2 bg-white"
            data-gallery-create-index="${idx}"
            draggable="true"
          >
            <div class="w-12 h-12 rounded border border-gray-200 overflow-hidden bg-gray-50 flex-shrink-0">
              <img
                src="${url}"
                alt="Gallery ${idx + 1}"
                class="w-full h-full object-cover"
                onerror="this.style.display='none'"
              />
            </div>
            <span class="text-sm break-all" title="${file.name}">${file.name}</span>
            <div class="flex items-center gap-1 ml-auto">
              <button
                type="button"
                class="px-2 py-1 text-xs text-red-600 border border-red-200 rounded"
                data-remove-gallery-create="${idx}"
              >
                삭제
              </button>
            </div>
          </div>
        `;
      }).join('');

      // 삭제
      galleryImagesStatus.querySelectorAll('[data-remove-gallery-create]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-remove-gallery-create'));
          if (!Number.isNaN(idx)) {
            window.galleryFileList.splice(idx, 1);
            refreshCreateGalleryStatus();
          }
        });
      });

      // 드래그로 순서 변경
      galleryImagesStatus.querySelectorAll('[data-gallery-create-index]').forEach((item) => {
        item.addEventListener('dragstart', (e) => {
          const idx = Number(item.getAttribute('data-gallery-create-index'));
          if (!Number.isNaN(idx)) {
            draggedGalleryIndex = idx;
            item.classList.add('opacity-50', 'ring-2', 'ring-indigo-400');
            if (e.dataTransfer) {
              e.dataTransfer.effectAllowed = 'move';
            }
          }
        });

        item.addEventListener('dragover', (e) => {
          e.preventDefault();
        });

        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetIdx = Number(item.getAttribute('data-gallery-create-index'));
          if (
            draggedGalleryIndex === null ||
            Number.isNaN(targetIdx) ||
            draggedGalleryIndex === targetIdx
          ) {
            draggedGalleryIndex = null;
            return;
          }

          const newList = [...window.galleryFileList];
          const [moved] = newList.splice(draggedGalleryIndex, 1);
          newList.splice(targetIdx, 0, moved);
          window.galleryFileList = newList;
          draggedGalleryIndex = null;
          refreshCreateGalleryStatus();
        });

        item.addEventListener('dragend', () => {
          draggedGalleryIndex = null;
        });
      });
    };

    if (galleryImagesFile && galleryImagesStatus) {
      galleryImagesFile.addEventListener('change', () => {
        if (galleryImagesFile.files?.length) {
          // 새로 선택한 파일들을 기존 리스트 뒤에 추가
          window.galleryFileList.push(...Array.from(galleryImagesFile.files));
        }
        // input 값 초기화해서 같은 파일을 다시 선택할 수 있게
        galleryImagesFile.value = '';
        refreshCreateGalleryStatus();
      });
    }

    lucide.createIcons();
  </script>

  <script>
    // Footer 아이콘 초기화
    // 로그아웃
    async function logout() {
      if (!confirm('로그아웃 하시겠습니까?')) return;
      
      try {
        const response = await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        const result = await response.json();
        if (result.success) {
          window.location.href = '/admin/login';
        }
      } catch (error) {
        console.error('로그아웃 오류:', error);
        alert('로그아웃 중 오류가 발생했습니다.');
      }
    }

    // 로그인 상태 확인
    async function checkAuth() {
      try {
        // API URL과 일관성 유지
        const authCheckUrl = '/bo-api/auth/check';

        console.log('🔐 인증 상태 확인:', { authCheckUrl });
        
        const response = await fetch(authCheckUrl, {
          method: 'GET',
          credentials: 'include', // 쿠키 전달 필수
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        if (!response.ok) {
          console.error('인증 확인 실패:', response.status);
          window.location.href = '/admin/login';
          return;
        }
        
        const result = await response.json();
        console.log('🔐 인증 상태:', result);
        
        if (!result.authenticated) {
          console.log('❌ 인증되지 않음, 로그인 페이지로 이동');
          window.location.href = '/admin/login';
          return;
        }
        
        console.log('✅ 인증 확인 완료');
      } catch (error) {
        console.error('인증 확인 오류:', error);
        window.location.href = '/admin/login';
      }
    }

    // S3 직접 업로드 함수들
    async function uploadFilesToS3WithProgress(files, folder = 'projects') {
      if (!files || files.length === 0) return [];

      const totalFiles = files.length;
      let completedFiles = 0;

      // 1. Presigned URL 요청
      updateUploadProgress(0, totalFiles, 0, 'Presigned URL 생성 중...');

      const fileInfos = Array.from(files).map(file => ({
        filename: file.name,
        contentType: file.type
      }));

      const response = await fetch(`/api/upload/presigned-urls`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: fileInfos, folder }),
        credentials: 'include'
      });

      if (!response.ok) {
        throw new Error('Presigned URL 생성 실패');
      }

      const { data: presignedData } = await response.json();

      // 2. 각 파일을 순차적으로 S3에 업로드
      const uploadedUrls = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const { uploadUrl, fileUrl } = presignedData[i];

        updateUploadProgress(
          completedFiles,
          totalFiles,
          (completedFiles / totalFiles) * 100,
          `${file.name} 업로드 중...`
        );

        const uploadResponse = await fetch(uploadUrl, {
          method: 'PUT',
          body: file,
          headers: {
            'Content-Type': file.type,
          },
        });

        if (!uploadResponse.ok) {
          throw new Error(`파일 업로드 실패: ${file.name}`);
        }

        uploadedUrls.push(fileUrl);
        completedFiles++;

        updateUploadProgress(
          completedFiles,
          totalFiles,
          (completedFiles / totalFiles) * 100,
          `${completedFiles}/${totalFiles} 파일 업로드 완료`
        );
      }

      return uploadedUrls;
    }

    // 업로드 진행 상황 관리 함수들
    function showUploadProgress(totalFiles) {
      const modal = document.getElementById('uploadProgressModal');
      const totalEl = document.getElementById('uploadTotalFiles');
      const currentEl = document.getElementById('uploadCurrentFile');
      const progressBar = document.getElementById('uploadProgressBar');
      const progressText = document.getElementById('uploadProgressText');
      const statusText = document.getElementById('uploadStatusText');

      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        if (totalEl) totalEl.textContent = totalFiles;
        if (currentEl) currentEl.textContent = '0';
        if (progressBar) progressBar.style.width = '0%';
        if (progressText) progressText.textContent = '0% 완료';
        if (statusText) statusText.textContent = '업로드 시작 중...';
        lucide.createIcons();
      }
    }

    function updateUploadProgress(current, total, percent, status) {
      const currentEl = document.getElementById('uploadCurrentFile');
      const progressBar = document.getElementById('uploadProgressBar');
      const progressText = document.getElementById('uploadProgressText');
      const statusText = document.getElementById('uploadStatusText');

      if (currentEl) currentEl.textContent = current;
      if (progressBar) progressBar.style.width = `${percent}%`;
      if (progressText) progressText.textContent = `${Math.round(percent)}% 완료`;
      if (statusText) statusText.textContent = status;
    }

    function hideUploadProgress() {
      const modal = document.getElementById('uploadProgressModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function uploadWithProgress(url, formData, totalFiles) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            const percentComplete = (e.loaded / e.total) * 100;
            updateUploadProgress(
              totalFiles,
              totalFiles,
              percentComplete,
              `업로드 중... (${Math.round(e.loaded / 1024)}KB / ${Math.round(e.total / 1024)}KB)`
            );
          }
        });

        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const data = JSON.parse(xhr.responseText);
              resolve(data);
            } catch (e) {
              reject(new Error('응답 파싱 실패'));
            }
          } else {
            try {
              const data = JSON.parse(xhr.responseText);
              reject(new Error(data.error || `서버 오류: ${xhr.status}`));
            } catch (e) {
              reject(new Error(`서버 오류: ${xhr.status}`));
            }
          }
        });

        xhr.addEventListener('error', () => {
          reject(new Error('네트워크 오류가 발생했습니다'));
        });

        xhr.addEventListener('abort', () => {
          reject(new Error('업로드가 취소되었습니다'));
        });

        xhr.open('POST', url);
        xhr.withCredentials = true;
        xhr.send(formData);
      });
    }

    // 초기 로드
    checkAuth();
    lucide.createIcons();
  </script>
