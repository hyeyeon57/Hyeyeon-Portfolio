<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 (모듈화)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">관리자 대시보드</h1>
        <p class="text-gray-500 text-sm">모듈화된 새 대시보드</p>
      </div>
      <div class="flex items-center gap-3">
        <div id="mongodbStatus" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm">
          <span class="w-2 h-2 rounded-full bg-gray-400 animate-pulse"></span>
          <span class="text-gray-600">MongoDB 확인 중...</span>
        </div>
        <button id="logoutBtn" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition flex items-center gap-2" style="display:none;">
          <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
        </button>
      </div>
    </header>

    <div class="border-b mb-6">
      <nav class="-mb-px flex space-x-8" aria-label="Tabs">
        <button class="tab-btn active" data-tab="projects">프로젝트</button>
        <button class="tab-btn" data-tab="contacts">연락</button>
        <button class="tab-btn" data-tab="visitors">방문자</button>
      </nav>
    </div>

    <div id="content-projects" class="tab-content">
      <div class="bg-white border rounded-xl shadow-sm">
        <div class="px-6 py-4 border-b flex items-center justify-between">
          <h2 class="text-xl font-semibold text-gray-900">프로젝트 목록</h2>
          <a href="/admin/create" id="createBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium" style="display:none;">프로젝트 추가</a>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">제목</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">카테고리</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">태그</th>
                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">대표</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">작업</th>
              </tr>
            </thead>
            <tbody id="projectsTable" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="content-contacts" class="tab-content hidden">
      <div class="bg-white border rounded-xl shadow-sm">
        <div class="px-6 py-4 border-b">
          <h2 class="text-xl font-semibold text-gray-900">연락 목록</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">날짜</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">이름</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">이메일</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">메시지</th>
              </tr>
            </thead>
            <tbody id="contactsTable" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="content-visitors" class="tab-content hidden">
      <div class="mb-6" id="visitor-stats"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white border rounded-xl shadow-sm" id="visitor-today-chart"></div>
        <div class="bg-white border rounded-xl shadow-sm" id="visitor-weekly-chart"></div>
        <div class="bg-white border rounded-xl shadow-sm" id="visitor-daily-chart"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { renderDetailModal, renderEditModal } from '/templates/projectTemplates.js';
    import { statsCardsTemplate, todayChartTemplate, weeklyChartTemplate, monthlyChartTemplate } from '/templates/statsTemplates.js';
    import { categoryLabels } from '/templates/utils.js';

    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_URL = isLocalhost ? 'http://localhost:3005/api' : '/bo-api';

    let projects = [];
    let contacts = [];
    let visitorsMonthly = { monthly: [], labels: [] };
    let currentMonthlyYear = new Date().getFullYear();
    let currentMonthlyMonth = new Date().getMonth() + 1;
    let isAuthenticated = false;

    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    function switchTab(tab) {
      tabButtons.forEach(btn => {
        const active = btn.dataset.tab === tab;
        btn.classList.toggle('active', active);
        btn.classList.toggle('border-blue-600', active);
        btn.classList.toggle('text-blue-600', active);
      });
      tabContents.forEach(content => {
        content.classList.toggle('hidden', content.id !== `content-${tab}`);
      });
    }
    tabButtons.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

    async function checkAuth() {
      try {
        const url = isLocalhost ? 'http://localhost:3005/api/auth/check' : '/bo-api/auth/check';
        const res = await fetch(url, { credentials: 'include' });
        const data = await res.json();
        isAuthenticated = !!data.authenticated;
        document.getElementById('logoutBtn').style.display = isAuthenticated ? 'flex' : 'none';
        const createBtn = document.getElementById('createBtn');
        if (createBtn) createBtn.style.display = isAuthenticated ? 'inline-flex' : 'none';
      } catch (e) {
        isAuthenticated = false;
      }
    }

    async function toggleFeatured(id) {
      if (!isAuthenticated) {
        alert('로그인이 필요합니다.');
        return;
      }
      const project = projects.find(p => p.id === id || p._id === id);
      if (!project) return;
      const projectId = project._id || project.id;
      const newFeatured = !(project.featured === true || project.featured === 'true');
      try {
        const res = await fetch(`${API_URL}/projects/${projectId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ featured: newFeatured }),
        });
        const data = await res.json();
        if (data.success) {
          await loadProjects();
        } else {
          alert(data.error || '대표 설정에 실패했습니다.');
        }
      } catch (e) {
        console.error('toggle featured error', e);
        alert('대표 설정 중 오류가 발생했습니다.');
      }
    }

    async function loadProjects() {
      const res = await fetch(`${API_URL}/projects`, { credentials: 'include' });
      const data = await res.json();
      projects = Array.isArray(data.data) ? data.data : [];
      renderProjects();
    }

    function renderProjects() {
      const tbody = document.getElementById('projectsTable');
      tbody.innerHTML = projects.map(p => {
        const isFeatured = p.featured === true || p.featured === 'true';
        const projectId = p.id || p._id;
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-3 text-sm text-gray-900">${p.title}</td>
            <td class="px-6 py-3 text-sm text-gray-600">${categoryLabels[p.category] || p.category}</td>
            <td class="px-6 py-3 text-sm text-gray-600">${(p.tags || []).slice(0,3).join(', ')}</td>
            <td class="px-6 py-3 text-center">
              <button class="inline-flex items-center justify-center p-1 hover:bg-gray-100 rounded" onclick="toggleFeatured('${projectId}')" title="${isFeatured ? '대표 해제' : '대표 설정'}">
                <i data-lucide="${isFeatured ? 'pin' : 'pin-off'}" class="w-4 h-4 ${isFeatured ? 'text-yellow-600' : 'text-gray-400'}" fill="${isFeatured ? 'currentColor' : 'none'}"></i>
              </button>
            </td>
            <td class="px-6 py-3 text-right space-x-2">
              <button class="text-blue-600 hover:underline" onclick="viewDetail('${projectId}')" title="상세 보기">🔍</button>
              ${isAuthenticated ? `
                <button class="text-emerald-600 hover:underline" onclick="editProject('${projectId}')" title="수정하기">✏️</button>
                <button class="text-red-600 hover:underline" onclick="deleteProject('${projectId}')" title="삭제하기">🗑️</button>
              ` : ''}
            </td>
          </tr>
        `;
      }).join('');
      // 아이콘 갱신
      setTimeout(() => lucide.createIcons(), 0);
    }

    async function viewDetail(id) {
      const project = projects.find(p => p.id === id || p._id === id);
      if (!project) return;
      const projectId = project._id || project.id;
      let files = [];
      try {
        const res = await fetch(`${API_URL}/projects/${projectId}/files`);
        const data = await res.json();
        if (data.success && Array.isArray(data.data)) files = data.data;
      } catch (e) {}
      const detailHtml = renderDetailModal(project, files, categoryLabels, isAuthenticated);
      document.body.insertAdjacentHTML('beforeend', detailHtml);
      lucide.createIcons();
      initDetailTabs(projectId);
    }

    function downloadFile(projectId, filename) {
      const downloadUrl = `${API_URL}/projects/${projectId}/files/${encodeURIComponent(filename)}`;
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function editProject(id) {
      if (!isAuthenticated) {
        alert('로그인이 필요합니다.');
        return;
      }
      const project = projects.find(p => p.id === id || p._id === id);
      if (!project) return;
      const html = renderEditModal(project, categoryLabels);
      document.body.insertAdjacentHTML('beforeend', html);
      lucide.createIcons();

      let galleryList = Array.isArray(project.images) && project.images.length ? [...project.images] : [];
      let removeMainImage = false;
      let removeDesignPdf = false;
      let removeDetailPdf = false;

      const refreshGalleryStatus = () => {
        const container = document.getElementById('editGalleryImagesStatus');
        if (!container) return;
        container.innerHTML = galleryList.map((img, idx) => `
          <div class="flex items-center gap-2" data-existing-gallery="${img}">
            <span class="truncate max-w-[240px]" title="${img}">${img.split('/').pop()}</span>
            <button type="button" class="px-2 py-1 text-xs text-red-600 border border-red-200 rounded" data-remove-gallery="${idx}">삭제</button>
          </div>
        `).join('');
        container.querySelectorAll('[data-remove-gallery]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-remove-gallery'));
            if (!Number.isNaN(idx)) {
              galleryList.splice(idx, 1);
              refreshGalleryStatus();
            }
          });
        });
      };
      refreshGalleryStatus();

      const removeMainBtn = document.getElementById('removeMainImageBtn');
      if (removeMainBtn) {
        removeMainBtn.addEventListener('click', () => {
          removeMainImage = true;
          galleryList = galleryList.filter((img) => img !== project.image);
          const status = document.getElementById('editMainImageStatus');
          if (status) status.textContent = '삭제됨';
        });
      }

      const removeDesignBtn = document.getElementById('removeDesignPdfBtn');
      if (removeDesignBtn) {
        removeDesignBtn.addEventListener('click', () => {
          removeDesignPdf = true;
          const status = document.getElementById('editDesignPdfStatus');
          if (status) status.textContent = '삭제됨';
          const hidden = document.getElementById('editDesignPdf');
          if (hidden) hidden.value = '';
        });
      }
      const removeDetailBtn = document.getElementById('removeDetailPdfBtn');
      if (removeDetailBtn) {
        removeDetailBtn.addEventListener('click', () => {
          removeDetailPdf = true;
          const status = document.getElementById('editDetailPdfStatus');
          if (status) status.textContent = '삭제됨';
          const hidden = document.getElementById('editDetailPdf');
          if (hidden) hidden.value = '';
        });
      }

      const form = document.getElementById('editForm');
      const startInput = document.getElementById('editStartDate');
      const endInput = document.getElementById('editEndDate');
      const durationInput = document.getElementById('editDuration');

      const updateDuration = () => {
        const startVal = startInput?.value;
        const endVal = endInput?.value;
        const dur = computeDurationText(startVal, endVal);
        if (durationInput) durationInput.value = dur;
      };
      if (startInput) startInput.addEventListener('change', () => {
        if (endInput && endInput.value && startInput.value && endInput.value < startInput.value) {
          endInput.value = '';
        }
        updateDuration();
      });
      if (endInput) endInput.addEventListener('change', () => {
        if (startInput && startInput.value && endInput.value && endInput.value < startInput.value) {
          startInput.value = '';
        }
        updateDuration();
      });
      updateDuration();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const payload = {
          title: fd.get('title'),
          subtitle: fd.get('subtitle') || '',
          description: fd.get('description'),
          fullDescription: fd.get('fullDescription') || fd.get('description') || '',
          category: fd.get('category'),
          tags: fd.get('tags') ? fd.get('tags').toString().split(',').map(t => t.trim()).filter(Boolean) : [],
          startDate: fd.get('startDate') || '',
          endDate: fd.get('endDate') || '',
          date: fd.get('startDate') && fd.get('endDate') ? `${fd.get('startDate')} ~ ${fd.get('endDate')}` : '',
          team: fd.get('team') || '',
          role: fd.get('role') || '',
          duration: fd.get('duration') || '',
          link: fd.get('link') || '',
          designPdf: fd.get('designPdf') || '',
          detailPdf: fd.get('detailPdf') || '',
          achievements: fd.get('achievements') ? fd.get('achievements').toString().split('\\n').map(a => a.trim()).filter(Boolean) : [],
          featured: fd.get('featured') === 'on',
          startDate: fd.get('startDate') || '',
          endDate: fd.get('endDate') || '',
          images: galleryList,
          gallery: galleryList,
          removeMainImage,
          removeDesignPdf,
          removeDetailPdf,
        };

        const sendFd = new FormData();
        const mainImageFile = document.getElementById('editMainImageFile').files?.[0];
        if (mainImageFile) sendFd.append('mainImage', mainImageFile);
        const galleryFiles = document.getElementById('editGalleryImagesFile').files;
        if (galleryFiles && galleryFiles.length > 0) {
          Array.from(galleryFiles).forEach(f => sendFd.append('images', f));
        }
        sendFd.append('project', JSON.stringify(payload));

        const projectId = project._id || project.id;
        const res = await fetch(`${API_URL}/projects/${projectId}`, { method:'PUT', body: sendFd, credentials:'include' });
        const data = await res.json();
        if (data.success) {
          alert('수정되었습니다');
          form.closest('.fixed').remove();
          await loadProjects();
        } else {
          alert(data.error || '수정 실패');
        }
      });

      window.uploadPdfInEdit = async (kind) => {
        const prefix = kind.charAt(0).toUpperCase() + kind.slice(1);
        const fileInput = document.getElementById(`edit${prefix}PdfFile`);
        const statusEl = document.getElementById(`edit${prefix}PdfStatus`);
        const hiddenInput = document.getElementById(`edit${prefix}Pdf`);
        if (!fileInput.files?.length) return alert('PDF 파일을 선택하세요.');
        const file = fileInput.files[0];
        statusEl.textContent = '업로드 중...';
        try {
          const fdUp = new FormData();
          fdUp.append('file', file);
          const resp = await fetch('/api/upload-pdf', { method:'POST', body: fdUp });
          if (!resp.ok) throw new Error(await resp.text());
          const result = await resp.json();
          if (!result.success) throw new Error(result.error || '업로드 실패');
          hiddenInput.value = result.path;
          statusEl.innerHTML = `<a href="${result.path}" target="_blank" class="text-blue-600 underline text-sm">${result.filename}</a>`;
          fileInput.value = '';
        } catch (err) {
          statusEl.textContent = '업로드 실패';
        }
      };
    }

    async function loadContacts() {
      const res = await fetch(`${API_URL}/contacts`);
      const data = await res.json();
      contacts = Array.isArray(data.data) ? data.data : [];
      const tbody = document.getElementById('contactsTable');
      tbody.innerHTML = contacts.map(c => `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-3 text-sm text-gray-600">${new Date(c.createdAt).toLocaleString('ko-KR')}</td>
          <td class="px-6 py-3 text-sm text-gray-900">${c.name}</td>
          <td class="px-6 py-3 text-sm text-gray-600">${c.email}</td>
          <td class="px-6 py-3 text-sm text-gray-600 truncate max-w-[240px]" title="${c.message}">${c.message}</td>
        </tr>
      `).join('');
    }

    async function loadVisitorStatsForTab() {
      const res = await fetch(`${API_URL}/visitors/stats`);
      const stats = await res.json();
      renderVisitorStats(stats);
    }

    function renderVisitorStats(stats) {
      const statsContainer = document.getElementById('visitor-stats');
      if (statsContainer) {
        statsContainer.innerHTML = statsCardsTemplate(stats);
        setTimeout(() => lucide.createIcons(), 0);
      }
      if (stats.hourly) renderTodayChart(stats.hourly, stats.today || 0);
      if (stats.weekly) renderWeeklyChart(stats.weekly, stats.thisWeek || 0);
      // monthly handled separately
    }

    function renderTodayChart(hourlyData, total) {
      const chartContainer = document.getElementById('visitor-today-chart');
      if (!chartContainer) return;
      const maxValue = Math.max(...hourlyData, 1);
      const chartHeight = 250, barWidth = 24, barGap = 4;
      const totalWidth = (barWidth + barGap) * 24;
      const currentHour = new Date().getHours();
      chartContainer.innerHTML = todayChartTemplate({ hourlyData, total, maxValue, chartHeight, barWidth, barGap, currentHour, totalWidth });
      const bars = chartContainer.querySelectorAll('.bar-today');
      const tooltip = document.getElementById('tooltip-today');
      const scrollContainer = chartContainer.querySelector('#today-chart-scroll');
      if (scrollContainer) {
        const x = currentHour * (barWidth + barGap);
        const pos = x - scrollContainer.clientWidth / 2 + barWidth / 2;
        scrollContainer.scrollLeft = Math.max(0, pos);
      }
      bars.forEach(bar => {
        bar.addEventListener('mouseenter', (e) => showTooltip(e, 'today', bar, tooltip, chartContainer));
        bar.addEventListener('mouseleave', () => hideTooltip(tooltip));
      });
    }

    function renderWeeklyChart(weeklyData, total) {
      const chartContainer = document.getElementById('visitor-weekly-chart');
      if (!chartContainer) return;
      const maxValue = Math.max(...weeklyData, 1);
      const chartHeight = 250;
      const dayLabels = ['월','화','수','목','금','토','일'];
      const currentDay = new Date().getDay();
      const adjustedCurrentDay = currentDay === 0 ? 6 : currentDay - 1;
      chartContainer.innerHTML = weeklyChartTemplate({ weeklyData, total, maxValue, chartHeight, dayLabels, adjustedCurrentDay });
      const bars = chartContainer.querySelectorAll('.bar-weekly');
      const tooltip = document.getElementById('tooltip-weekly');
      bars.forEach(bar => {
        bar.addEventListener('mouseenter', (e) => showTooltip(e, 'weekly', bar, tooltip, chartContainer));
        bar.addEventListener('mouseleave', () => hideTooltip(tooltip));
      });
    }

    function initDetailTabs(projectId) {
      const tabGroup = `tabs-${projectId}`;
      const imgPane = document.getElementById(`images-${projectId}`);
      const pdfPane = document.getElementById(`pdfs-${projectId}`);
      const btns = document.querySelectorAll(`[data-tab-btn="${tabGroup}"]`);
      if (!btns.length) return;
      const setActive = (target) => {
        btns.forEach((b) => {
          const active = b.dataset.target === target;
          b.classList.toggle('bg-blue-600', active);
          b.classList.toggle('text-white', active);
          b.classList.toggle('bg-gray-100', !active);
          b.classList.toggle('text-gray-700', !active);
        });
        if (imgPane) imgPane.classList.toggle('hidden', target !== imgPane.id);
        if (pdfPane) pdfPane.classList.toggle('hidden', target !== pdfPane.id);
      };
      btns.forEach((b) => b.addEventListener('click', () => setActive(b.dataset.target)));
      // default to images
      setActive(`images-${projectId}`);
    }

    async function loadMonthlyData(year, month) {
      const res = await fetch(`${API_URL}/visitors/monthly?year=${year}&month=${month}`);
      const result = await res.json();
      if (result.success && Array.isArray(result.monthly)) {
        const labels = result.labels?.length ? result.labels : Array.from({length: result.monthly.length}, (_,i)=>`${i+1}`);
        renderDailyChart(result.monthly, labels);
      } else {
        const days = new Date(year, month, 0).getDate();
        renderDailyChart(Array(days).fill(0), Array.from({length:days},(_,i)=>`${i+1}`));
      }
    }

    function renderDailyChart(dailyData, labels) {
      const chartContainer = document.getElementById('visitor-daily-chart');
      if (!chartContainer) return;
      const chartHeight = 250, barWidth = 24, barGap = 4;
      chartContainer.innerHTML = monthlyChartTemplate({
        safeData: dailyData,
        safeLabels: labels,
        currentMonthlyYear,
        currentMonthlyMonth,
        chartHeight,
        barWidth,
        barGap
      });
      lucide.createIcons();
      const tooltip = document.getElementById('tooltip-daily');
      chartContainer.querySelectorAll('.bar-daily').forEach((bar, idx) => {
        bar.addEventListener('mouseenter', (e) => showTooltip(e, 'daily', bar, tooltip, chartContainer));
        bar.addEventListener('mouseleave', () => hideTooltip(tooltip));
      });
    }

    function changeMonthlyDate(direction) {
      currentMonthlyMonth += direction;
      if (currentMonthlyMonth > 12) { currentMonthlyMonth = 1; currentMonthlyYear++; }
      if (currentMonthlyMonth < 1) { currentMonthlyMonth = 12; currentMonthlyYear--; }
      document.getElementById('monthly-year-select').value = currentMonthlyYear;
      document.getElementById('monthly-month-select').value = currentMonthlyMonth;
      loadMonthlyData(currentMonthlyYear, currentMonthlyMonth);
    }
    function updateMonthlyChart() {
      currentMonthlyYear = parseInt(document.getElementById('monthly-year-select').value);
      currentMonthlyMonth = parseInt(document.getElementById('monthly-month-select').value);
      loadMonthlyData(currentMonthlyYear, currentMonthlyMonth);
    }
    window.changeMonthlyDate = changeMonthlyDate;
    window.updateMonthlyChart = updateMonthlyChart;

    function showTooltip(event, type, bar, tooltip, container) {
      const t = tooltip || document.getElementById(`tooltip-${type}`);
      const c = container || t?.parentElement;
      if (!t || !c) return;
      let text = '';
      if (type === 'today') text = `${bar.getAttribute('data-hour')}시: ${bar.getAttribute('data-count')}명`;
      if (type === 'weekly') text = `${bar.getAttribute('data-label')}요일: ${bar.getAttribute('data-count')}명`;
      if (type === 'daily') text = `${bar.getAttribute('data-label')}: ${bar.getAttribute('data-count')}명`;
      t.textContent = text;
      t.style.opacity = '1';
      t.style.display = 'block';
      const rect = bar.getBoundingClientRect();
      const crect = c.getBoundingClientRect();
      const x = rect.left + rect.width/2 - crect.left;
      const y = rect.top - crect.top - 35;
      t.style.left = `${x}px`;
      t.style.top = `${y}px`;
    }
    function hideTooltip(tooltipEl) {
      if (!tooltipEl) return;
      tooltipEl.style.opacity = '0';
      tooltipEl.style.display = 'none';
    }

    function computeDurationText(start, end) {
      if (!start || !end) return '';
      const s = new Date(start);
      const e = new Date(end);
      if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime()) || e < s) return '';
      let diffDays = Math.floor((e - s) / (1000 * 60 * 60 * 24));
      const years = Math.floor(diffDays / 365); diffDays %= 365;
      let months = Math.floor(diffDays / 30); diffDays %= 30;
      let weeks = Math.floor(diffDays / 7); diffDays %= 7;
      if (weeks >= 12) {
        months += Math.floor(weeks / 4);
        weeks = weeks % 4;
      }
      const parts = [];
      if (years > 0) {
        parts.push(`${years}년`);
        if (months > 0) parts.push(`${months}개월`);
      } else if (months > 0) {
        parts.push(`${months}개월`);
        if (weeks > 0) parts.push(`${weeks}주`);
      } else if (weeks > 0) {
        parts.push(`${weeks}주`);
        if (diffDays > 0) parts.push(`${diffDays}일`);
      } else if (diffDays > 0) {
        parts.push(`${diffDays}일`);
      }
      return parts.join(' ');
    }

    async function deleteProject(id) {
      if (!isAuthenticated) {
        alert('로그인이 필요합니다.');
        return;
      }
      if (!confirm('프로젝트를 삭제하시겠습니까?')) return;
      try {
        const res = await fetch(`${API_URL}/projects/${id}`, { method: 'DELETE', credentials: 'include' });
        const data = await res.json();
        if (data.success) {
          await loadProjects();
        } else {
          alert(data.error || '삭제에 실패했습니다.');
        }
      } catch (e) {
        alert('삭제 중 오류가 발생했습니다.');
      }
    }

    async function logout() {
      if (!confirm('로그아웃 하시겠습니까?')) return;
      await fetch(`${API_URL}/auth/logout`, { method:'POST', credentials:'include' });
      window.location.href = '/admin/login';
    }
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // MongoDB 상태 체크
    async function checkMongoStatus() {
      try {
        const res = await fetch(`${API_URL}/health`);
        const data = await res.json();
        const statusEl = document.getElementById('mongodbStatus');
        if (!statusEl) return;
        const dot = statusEl.querySelector('span');
        const text = statusEl.querySelector('span:nth-child(2)');
        const ok = data?.connected === true || data?.mongodb?.connected === true;
        dot.className = `w-2 h-2 rounded-full ${ok ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`;
        text.textContent = ok ? 'MongoDB 연결됨' : 'MongoDB 연결 실패';
      } catch (e) {
        const statusEl = document.getElementById('mongodbStatus');
        if (statusEl) {
          const dot = statusEl.querySelector('span');
          const text = statusEl.querySelector('span:nth-child(2)');
          dot.className = 'w-2 h-2 rounded-full bg-red-500 animate-pulse';
          text.textContent = 'MongoDB 연결 실패';
        }
      }
    }

    // 전역 노출 (인라인 onclick 대응)
    window.viewDetail = viewDetail;
    window.editProject = editProject;
    window.downloadFile = downloadFile;
    window.toggleFeatured = toggleFeatured;
    window.changeMonthlyDate = changeMonthlyDate;
    window.updateMonthlyChart = updateMonthlyChart;
    window.initDetailTabs = initDetailTabs;
    window.deleteProject = deleteProject;

    // 초기 실행
    (async () => {
      await checkAuth();
      await checkMongoStatus();
      await loadProjects();
      await loadContacts();
      await loadVisitorStatsForTab();
      await loadMonthlyData(currentMonthlyYear, currentMonthlyMonth);
      lucide.createIcons();
    })();
  </script>
</body>
