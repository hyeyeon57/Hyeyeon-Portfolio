<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 (모듈화)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">관리자 대시보드</h1>
        <p class="text-gray-500 text-sm">모듈화된 새 대시보드</p>
      </div>
      <div class="flex items-center gap-3">
        <div id="mongodbStatus" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm">
          <span class="w-2 h-2 rounded-full bg-gray-400 animate-pulse"></span>
          <span class="text-gray-600">MongoDB 확인 중...</span>
        </div>
        <button id="logoutBtn" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition flex items-center gap-2" style="display:none;">
          <i data-lucide="log-out" class="w-4 h-4"></i> 로그아웃
        </button>
      </div>
    </header>

    <div class="border-b mb-6">
      <nav class="-mb-px flex space-x-8" aria-label="Tabs">
        <button class="tab-btn active" data-tab="projects">프로젝트</button>
        <button class="tab-btn" data-tab="contacts">연락</button>
        <button class="tab-btn" data-tab="visitors">방문자</button>
      </nav>
    </div>

    <div id="content-projects" class="tab-content">
      <div class="bg-white border rounded-xl shadow-sm">
        <div class="px-6 py-4 border-b flex items-center justify-between">
          <h2 class="text-xl font-semibold text-gray-900">프로젝트 목록</h2>
          <a href="/admin/create" id="createBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium" style="display:none;">프로젝트 추가</a>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">제목</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">카테고리</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">태그</th>
                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">대표</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">작업</th>
              </tr>
            </thead>
            <tbody id="projectsTable" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="content-contacts" class="tab-content hidden">
      <div class="bg-white border rounded-xl shadow-sm">
        <div class="px-6 py-5 border-b">
          <div class="flex flex-col gap-4">
            <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
              <div>
                <h2 class="text-xl font-semibold text-gray-900">연락 관리</h2>
                <p class="text-sm text-gray-500 mt-1">포트폴리오를 통해 받은 연락을 확인하고 관리하세요.</p>
              </div>
              <div class="flex flex-wrap items-end gap-3">
                <div class="flex items-center gap-2">
                  <label class="text-sm font-medium text-gray-700 whitespace-nowrap" for="contact-start-date">날짜</label>
                  <input
                    type="date"
                    id="contact-start-date"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  />
                  <span class="text-gray-500">~</span>
                  <input
                    type="date"
                    id="contact-end-date"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  />
                </div>
                <div class="flex items-center gap-2">
                  <label class="text-sm font-medium text-gray-700 whitespace-nowrap" for="contact-sort">정렬</label>
                  <select
                    id="contact-sort"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  >
                    <option value="newest" selected>최신순</option>
                    <option value="oldest">오래된순</option>
                  </select>
                </div>
                <button
                  onclick="applyContactFilters()"
                  class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium flex items-center gap-2"
                >
                  <i data-lucide="search" class="w-4 h-4"></i>
                  검색
                </button>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="contact-stats"></div>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">날짜</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">이름</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">이메일</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">메시지</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">상태</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">작업</th>
              </tr>
            </thead>
            <tbody id="contactsTable" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="content-visitors" class="tab-content hidden">
      <div class="mb-6" id="visitor-stats"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-white border rounded-xl shadow-sm" id="visitor-today-chart"></div>
        <div class="bg-white border rounded-xl shadow-sm" id="visitor-weekly-chart"></div>
        <div class="bg-white border rounded-xl shadow-sm" id="visitor-daily-chart"></div>
      </div>

      <!-- 방문자 기록 테이블 -->
      <div class="bg-white rounded-xl shadow-sm border">
        <div class="px-6 py-4 border-b">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h2 class="text-xl font-semibold text-gray-900">방문자 기록</h2>
              <p class="text-sm text-gray-500 mt-1">방문한 사용자 목록</p>
            </div>
            <button
              onclick="clearVisitors()"
              class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors text-sm font-medium flex items-center gap-2"
              id="clearVisitorsBtn"
              style="display:none;"
            >
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              기록 초기화
            </button>
          </div>
          <!-- 필터 UI -->
          <div class="flex flex-wrap items-center gap-3 p-3 bg-gray-50 rounded-lg">
            <div class="flex items-center gap-2">
              <label class="text-sm font-medium text-gray-700 whitespace-nowrap">날짜:</label>
              <input
                type="date"
                id="visitor-start-date"
                class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                onchange="updateDateConstraints()"
              />
              <span class="text-gray-500">~</span>
              <input
                type="date"
                id="visitor-end-date"
                class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                onchange="updateDateConstraints()"
              />
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm font-medium text-gray-700 whitespace-nowrap">정렬:</label>
              <select
                id="visitor-sort"
                class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              >
                <option value="newest">최신순</option>
                <option value="oldest">오래된순</option>
              </select>
            </div>
            <button
              onclick="searchVisitors()"
              class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium flex items-center gap-2 whitespace-nowrap"
            >
              <i data-lucide="search" class="w-4 h-4"></i>
              검색
            </button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">방문 시간</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">경로</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP 주소</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User Agent</th>
              </tr>
            </thead>
            <tbody id="visitorsTable" class="bg-white divide-y divide-gray-200">
              <!-- 방문자 목록은 JavaScript로 동적 생성 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 업로드 진행 상황 모달 -->
  <div id="uploadProgressModal" class="fixed inset-0 bg-black/50 z-[60] hidden items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full mx-4 p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
          <i data-lucide="upload" class="w-5 h-5 text-blue-600"></i>
        </div>
        <div>
          <h3 class="text-lg font-semibold text-gray-900">이미지 업로드 중</h3>
          <p class="text-sm text-gray-500" id="uploadProgressText">0% 완료</p>
        </div>
      </div>

      <!-- 프로그레스 바 -->
      <div class="mb-4">
        <div class="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
          <div id="uploadProgressBar" class="h-full bg-blue-600 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- 파일 카운트 -->
      <div class="flex items-center justify-between text-sm">
        <span class="text-gray-600">
          <span id="uploadCurrentFile">0</span> / <span id="uploadTotalFiles">0</span> 파일
        </span>
        <span class="text-gray-500" id="uploadStatusText">업로드 준비 중...</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { renderDetailModal, renderEditModal } from '/templates/projectTemplates.js';
    import { statsCardsTemplate, todayChartTemplate, weeklyChartTemplate, monthlyChartTemplate } from '/templates/statsTemplates.js';
    import { categoryLabels } from '/templates/utils.js';

    // 포트 3000(Next.js)로 통합되었으므로 항상 /bo-api 사용
    const API_URL = '/bo-api';

    let projects = [];
    let contacts = [];
    const contactFilters = { sort: 'newest', startDate: '', endDate: '' };
    let visitorsMonthly = { monthly: [], labels: [] };
    let currentMonthlyYear = new Date().getFullYear();
    let currentMonthlyMonth = new Date().getMonth() + 1;
    let isAuthenticated = false;

    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    function switchTab(tab) {
      tabButtons.forEach(btn => {
        const active = btn.dataset.tab === tab;
        btn.classList.toggle('active', active);
        btn.classList.toggle('border-blue-600', active);
        btn.classList.toggle('text-blue-600', active);
      });
      tabContents.forEach(content => {
        content.classList.toggle('hidden', content.id !== `content-${tab}`);
      });
    }
    tabButtons.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

    async function checkAuth() {
      try {
        const url = '/bo-api/auth/check';
        const res = await fetch(url, { credentials: 'include' });
        const data = await res.json();
        isAuthenticated = !!data.authenticated;
        document.getElementById('logoutBtn').style.display = isAuthenticated ? 'flex' : 'none';
        const createBtn = document.getElementById('createBtn');
        if (createBtn) createBtn.style.display = isAuthenticated ? 'inline-flex' : 'none';
      } catch (e) {
        isAuthenticated = false;
      }
    }

    async function toggleFeatured(id) {
      if (!isAuthenticated) {
        alert('로그인이 필요합니다.');
        return;
      }
      const project = projects.find(p => p.id === id || p._id === id);
      if (!project) return;
      const projectId = project._id || project.id;
      const newFeatured = !(project.featured === true || project.featured === 'true');
      try {
        const res = await fetch(`${API_URL}/projects/${projectId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ featured: newFeatured }),
        });
        const data = await res.json();
        if (data.success) {
          await loadProjects();
        } else {
          alert(data.error || '대표 설정에 실패했습니다.');
        }
      } catch (e) {
        console.error('toggle featured error', e);
        alert('대표 설정 중 오류가 발생했습니다.');
      }
    }

    async function loadProjects() {
      const res = await fetch(`${API_URL}/projects`, { credentials: 'include' });
      const data = await res.json();
      projects = Array.isArray(data.data) ? data.data : [];
      renderProjects();
    }

    function renderProjects() {
      const tbody = document.getElementById('projectsTable');
      tbody.innerHTML = projects.map(p => {
        const isFeatured = p.featured === true || p.featured === 'true';
        const projectId = p.id || p._id;
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-3 text-sm text-gray-900">${p.title}</td>
            <td class="px-6 py-3 text-sm text-gray-600">${categoryLabels[p.category] || p.category}</td>
            <td class="px-6 py-3 text-sm text-gray-600">${(p.tags || []).slice(0,3).join(', ')}</td>
            <td class="px-6 py-3 text-center">
              <button class="inline-flex items-center justify-center p-1 hover:bg-gray-100 rounded" onclick="toggleFeatured('${projectId}')" title="${isFeatured ? '대표 해제' : '대표 설정'}">
                <i data-lucide="${isFeatured ? 'pin' : 'pin-off'}" class="w-4 h-4 ${isFeatured ? 'text-yellow-600' : 'text-gray-400'}" fill="${isFeatured ? 'currentColor' : 'none'}"></i>
              </button>
            </td>
            <td class="px-6 py-3 text-right space-x-2">
              <button class="text-blue-600 hover:underline" onclick="viewDetail('${projectId}')" title="상세 보기">🔍</button>
              ${isAuthenticated ? `
                <button class="text-emerald-600 hover:underline" onclick="editProject('${projectId}')" title="수정하기">✏️</button>
                <button class="text-red-600 hover:underline" onclick="deleteProject('${projectId}')" title="삭제하기">🗑️</button>
              ` : ''}
            </td>
          </tr>
        `;
      }).join('');
      // 아이콘 갱신
      setTimeout(() => lucide.createIcons(), 0);
    }

    async function viewDetail(id) {
      const project = projects.find(p => p.id === id || p._id === id);
      if (!project) return;
      const projectId = project._id || project.id;
      let files = [];
      try {
        const res = await fetch(`${API_URL}/projects/${projectId}/files`);
        const data = await res.json();
        if (data.success && Array.isArray(data.data)) files = data.data;
      } catch (e) {}
      const detailHtml = renderDetailModal(project, files, categoryLabels, isAuthenticated);
      document.body.insertAdjacentHTML('beforeend', detailHtml);
      lucide.createIcons();
      initDetailTabs(projectId);
    }

    function downloadFile(projectId, filename) {
      const downloadUrl = `${API_URL}/projects/${projectId}/files/${encodeURIComponent(filename)}`;
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function editProject(id) {
      if (!isAuthenticated) {
        alert('로그인이 필요합니다.');
        return;
      }
      const project = projects.find(p => p.id === id || p._id === id);
      if (!project) return;
      const html = renderEditModal(project, categoryLabels);
      document.body.insertAdjacentHTML('beforeend', html);
      lucide.createIcons();

      let galleryList = Array.isArray(project.images) && project.images.length ? [...project.images] : [];
      let removeMainImage = false;
      let removeDesignPdf = false;
      let removeDetailPdf = false;

      const refreshGalleryStatus = () => {
        const container = document.getElementById('editGalleryImagesStatus');
        if (!container) return;
        container.innerHTML = galleryList.map((img, idx) => `
          <div class="flex items-center gap-2" data-existing-gallery="${img}">
            <span class="truncate max-w-[240px]" title="${img}">${img.split('/').pop()}</span>
            <button type="button" class="px-2 py-1 text-xs text-red-600 border border-red-200 rounded" data-remove-gallery="${idx}">삭제</button>
          </div>
        `).join('');
        container.querySelectorAll('[data-remove-gallery]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-remove-gallery'));
            if (!Number.isNaN(idx)) {
              galleryList.splice(idx, 1);
              refreshGalleryStatus();
            }
          });
        });
      };
      refreshGalleryStatus();

      const removeMainBtn = document.getElementById('removeMainImageBtn');
      if (removeMainBtn) {
        removeMainBtn.addEventListener('click', () => {
          removeMainImage = true;
          galleryList = galleryList.filter((img) => img !== project.image);
          const status = document.getElementById('editMainImageStatus');
          if (status) status.textContent = '삭제됨';
        });
      }

      const removeDesignBtn = document.getElementById('removeDesignPdfBtn');
      if (removeDesignBtn) {
        removeDesignBtn.addEventListener('click', () => {
          removeDesignPdf = true;
          const status = document.getElementById('editDesignPdfStatus');
          if (status) status.textContent = '삭제됨';
          const hidden = document.getElementById('editDesignPdf');
          if (hidden) hidden.value = '';
        });
      }
      const removeDetailBtn = document.getElementById('removeDetailPdfBtn');
      if (removeDetailBtn) {
        removeDetailBtn.addEventListener('click', () => {
          removeDetailPdf = true;
          const status = document.getElementById('editDetailPdfStatus');
          if (status) status.textContent = '삭제됨';
          const hidden = document.getElementById('editDetailPdf');
          if (hidden) hidden.value = '';
        });
      }

      const form = document.getElementById('editForm');
      const startInput = document.getElementById('editStartDate');
      const endInput = document.getElementById('editEndDate');
      const durationInput = document.getElementById('editDuration');

      const updateDuration = () => {
        const startVal = startInput?.value;
        const endVal = endInput?.value;
        const dur = computeDurationText(startVal, endVal);
        if (durationInput) durationInput.value = dur;
      };
      if (startInput) startInput.addEventListener('change', () => {
        if (endInput && endInput.value && startInput.value && endInput.value < startInput.value) {
          endInput.value = '';
        }
        updateDuration();
      });
      if (endInput) endInput.addEventListener('change', () => {
        if (startInput && startInput.value && endInput.value && endInput.value < startInput.value) {
          startInput.value = '';
        }
        updateDuration();
      });
      updateDuration();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const payload = {
          title: fd.get('title'),
          subtitle: fd.get('subtitle') || '',
          description: fd.get('description'),
          fullDescription: fd.get('fullDescription') || fd.get('description') || '',
          category: fd.get('category'),
          tags: fd.get('tags') ? fd.get('tags').toString().split(',').map(t => t.trim()).filter(Boolean) : [],
          startDate: fd.get('startDate') || '',
          endDate: fd.get('endDate') || '',
          date: fd.get('startDate') && fd.get('endDate') ? `${fd.get('startDate')} ~ ${fd.get('endDate')}` : '',
          team: fd.get('team') || '',
          role: fd.get('role') || '',
          duration: fd.get('duration') || '',
          link: fd.get('link') || '',
          designPdf: fd.get('designPdf') || '',
          detailPdf: fd.get('detailPdf') || '',
          achievements: fd.get('achievements') ? fd.get('achievements').toString().split('\\n').map(a => a.trim()).filter(Boolean) : [],
          startDate: fd.get('startDate') || '',
          endDate: fd.get('endDate') || '',
          images: galleryList,
          gallery: galleryList,
          removeMainImage,
          removeDesignPdf,
          removeDetailPdf,
        };

        const sendFd = new FormData();
        const mainImageFile = document.getElementById('editMainImageFile').files?.[0];
        if (mainImageFile) sendFd.append('mainImage', mainImageFile);
        const galleryFiles = document.getElementById('editGalleryImagesFile').files;
        if (galleryFiles && galleryFiles.length > 0) {
          Array.from(galleryFiles).forEach(f => sendFd.append('images', f));
        }
        sendFd.append('project', JSON.stringify(payload));

        // 업로드할 파일 개수 계산
        const totalFiles = (mainImageFile ? 1 : 0) + (galleryFiles ? galleryFiles.length : 0);

        // 업로드 진행 상황 모달 표시
        if (totalFiles > 0) {
          showUploadProgress(totalFiles);
        }

        const projectId = project._id || project.id;

        try {
          // XMLHttpRequest로 업로드 진행률 추적
          const data = await uploadWithProgress(`${API_URL}/projects/${projectId}`, sendFd, totalFiles);

          if (data.success) {
            updateUploadProgress(totalFiles, totalFiles, 100, '업로드 완료!');
            setTimeout(() => {
              hideUploadProgress();
              alert('수정되었습니다');
              form.closest('.fixed').remove();
              loadProjects();
            }, 500);
          } else {
            hideUploadProgress();
            alert(data.error || '수정 실패');
          }
        } catch (e) {
          hideUploadProgress();
          alert('업로드 중 오류가 발생했습니다: ' + e.message);
        }
      });

      window.uploadPdfInEdit = async (kind) => {

    function applyContactFilters() {
      const startInput = document.getElementById('contact-start-date');
      const endInput = document.getElementById('contact-end-date');
      const sortSelect = document.getElementById('contact-sort');

      contactFilters.startDate = startInput?.value || '';
      contactFilters.endDate = endInput?.value || '';
      contactFilters.sort = sortSelect?.value || 'newest';

      const startDate = contactFilters.startDate ? new Date(`${contactFilters.startDate}T00:00:00`) : null;
      const endDate = contactFilters.endDate ? new Date(`${contactFilters.endDate}T23:59:59.999`) : null;

      const filtered = contacts.filter(contact => {
        const date = getContactDate(contact);
        if (startDate && date < startDate) return false;
        if (endDate && date > endDate) return false;
        return true;
      });

      const sorted = [...filtered].sort((a, b) => {
        const diff = getContactDate(a).getTime() - getContactDate(b).getTime();
        return contactFilters.sort === 'oldest' ? diff : -diff;
      });

      renderContacts(sorted);
    }

    function showTooltip(event, type, bar, tooltip, container) {
      const t = tooltip || document.getElementById(`tooltip-${type}`);
      const c = container || t?.parentElement;
      if (!t || !c) return;
      let text = '';
      if (type === 'today') text = `${bar.getAttribute('data-hour')}시: ${bar.getAttribute('data-count')}명`;
      if (type === 'weekly') text = `${bar.getAttribute('data-label')}요일: ${bar.getAttribute('data-count')}명`;
      if (type === 'daily') text = `${bar.getAttribute('data-label')}: ${bar.getAttribute('data-count')}명`;
      t.textContent = text;
      t.style.opacity = '1';
      t.style.display = 'block';
      const rect = bar.getBoundingClientRect();
      const crect = c.getBoundingClientRect();
      const x = rect.left + rect.width/2 - crect.left;
      const y = rect.top - crect.top - 35;
      t.style.left = `${x}px`;
      t.style.top = `${y}px`;
    }
    function hideTooltip(tooltipEl) {
      if (!tooltipEl) return;
      tooltipEl.style.opacity = '0';
      tooltipEl.style.display = 'none';
    }

    function computeDurationText(start, end) {
      if (!start || !end) return '';
      const s = new Date(start);
      const e = new Date(end);
      if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime()) || e < s) return '';
      let diffDays = Math.floor((e - s) / (1000 * 60 * 60 * 24));
      const years = Math.floor(diffDays / 365); diffDays %= 365;
      let months = Math.floor(diffDays / 30); diffDays %= 30;
      let weeks = Math.floor(diffDays / 7); diffDays %= 7;
      if (weeks >= 12) {
        months += Math.floor(weeks / 4);
        weeks = weeks % 4;
      }
      const parts = [];
      if (years > 0) {
        parts.push(`${years}년`);
        if (months > 0) parts.push(`${months}개월`);
      } else if (months > 0) {
        parts.push(`${months}개월`);
        if (weeks > 0) parts.push(`${weeks}주`);
      } else if (weeks > 0) {
        parts.push(`${weeks}주`);
        if (diffDays > 0) parts.push(`${diffDays}일`);
      } else if (diffDays > 0) {
        parts.push(`${diffDays}일`);
      }
      return parts.join(' ');
    }

    // 방문자 목록 로드
    async function loadVisitors(startDate = null, endDate = null, sort = 'newest') {
      try {
        // 필터 파라미터 구성
        const params = new URLSearchParams();
        params.append('limit', '100'); // 더 많은 데이터 표시

        if (startDate) {
          params.append('startDate', startDate);
        }
        if (endDate) {
          params.append('endDate', endDate);
        }
        if (sort) {
          params.append('sort', sort);
        }

        const url = `${API_URL}/visitors?${params.toString()}`;

        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          },
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        if (result.success && Array.isArray(result.data)) {
          renderVisitors(result.data, result.total || 0);
        } else {
          renderVisitors([], 0);
        }
      } catch (error) {
        console.error('방문자 로드 오류:', error);
        renderVisitors([], 0);
      }
    }

      try {
        await loadVisitors(startDate, endDate, sort);
        console.log('검색 완료');
      } catch (error) {
        console.error('검색 오류:', error);
        alert('검색 중 오류가 발생했습니다: ' + error.message);
      } finally {
        if (searchBtn) {
          searchBtn.disabled = false;
          searchBtn.innerHTML = originalHTML;
          lucide.createIcons();
        }
      }
    }

    // 방문자 기록 초기화
    async function clearVisitors() {
      if (!confirm('정말로 모든 방문자 기록을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
        return;
      }

      const btn = document.getElementById('clearVisitorsBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 초기화 중...';
      lucide.createIcons();

      try {
        const response = await fetch(`${API_URL}/visitors`, {
          method: 'DELETE',
          credentials: 'include'
        });
        const result = await response.json();

        if (result.success) {
          alert(`방문자 기록 ${result.deletedCount || 0}개가 삭제되었습니다.`);
          // 방문자 목록 및 통계 새로고침
          await loadVisitors(null, null, 'newest');
          await loadVisitorStatsForTab();
        } else {
          alert(result.error || '방문자 기록 초기화에 실패했습니다.');
        }
      } catch (error) {
        console.error('방문자 기록 초기화 오류:', error);
        alert('방문자 기록 초기화 중 오류가 발생했습니다.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
        lucide.createIcons();
      }
    }

    // 업로드 진행 상황 관리 함수들
    function showUploadProgress(totalFiles) {
      const modal = document.getElementById('uploadProgressModal');
      const totalEl = document.getElementById('uploadTotalFiles');
      const currentEl = document.getElementById('uploadCurrentFile');
      const progressBar = document.getElementById('uploadProgressBar');
      const progressText = document.getElementById('uploadProgressText');
      const statusText = document.getElementById('uploadStatusText');

      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        if (totalEl) totalEl.textContent = totalFiles;
        if (currentEl) currentEl.textContent = '0';
        if (progressBar) progressBar.style.width = '0%';
        if (progressText) progressText.textContent = '0% 완료';
        if (statusText) statusText.textContent = '업로드 시작 중...';
        lucide.createIcons();
      }
    }

    function updateUploadProgress(current, total, percent, status) {
      const currentEl = document.getElementById('uploadCurrentFile');
      const progressBar = document.getElementById('uploadProgressBar');
      const progressText = document.getElementById('uploadProgressText');
      const statusText = document.getElementById('uploadStatusText');

      if (currentEl) currentEl.textContent = current;
      if (progressBar) progressBar.style.width = `${percent}%`;
      if (progressText) progressText.textContent = `${Math.round(percent)}% 완료`;
      if (statusText) statusText.textContent = status;
    }

    function hideUploadProgress() {
      const modal = document.getElementById('uploadProgressModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function uploadWithProgress(url, formData, totalFiles) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            const percentComplete = (e.loaded / e.total) * 100;
            updateUploadProgress(
              totalFiles,
              totalFiles,
              percentComplete,
              `업로드 중... (${Math.round(e.loaded / 1024)}KB / ${Math.round(e.total / 1024)}KB)`
            );
          }
        });

        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const data = JSON.parse(xhr.responseText);
              resolve(data);
            } catch (e) {
              reject(new Error('응답 파싱 실패'));
            }
          } else {
            try {
              const data = JSON.parse(xhr.responseText);
              reject(new Error(data.error || `서버 오류: ${xhr.status}`));
            } catch (e) {
              reject(new Error(`서버 오류: ${xhr.status}`));
            }
          }
        });

        xhr.addEventListener('error', () => {
          reject(new Error('네트워크 오류가 발생했습니다'));
        });

        xhr.addEventListener('abort', () => {
          reject(new Error('업로드가 취소되었습니다'));
        });

        xhr.open('PUT', url);
        xhr.withCredentials = true;
        xhr.send(formData);
      });
    }

    // 전역 노출 (인라인 onclick 대응)
    window.viewDetail = viewDetail;
    window.editProject = editProject;
    window.downloadFile = downloadFile;
    window.toggleFeatured = toggleFeatured;
    window.changeMonthlyDate = changeMonthlyDate;
    window.updateMonthlyChart = updateMonthlyChart;
    window.initDetailTabs = initDetailTabs;
    window.deleteProject = deleteProject;
    window.applyContactFilters = applyContactFilters;
    window.markContactRead = markContactRead;
    window.deleteContact = deleteContact;
    window.searchVisitors = searchVisitors;
    window.updateDateConstraints = updateDateConstraints;
    window.clearVisitors = clearVisitors;
    window.showUploadProgress = showUploadProgress;
    window.updateUploadProgress = updateUploadProgress;
    window.hideUploadProgress = hideUploadProgress;
    window.uploadWithProgress = uploadWithProgress;

    // 초기 실행
    (async () => {
      await checkAuth();
      await checkMongoStatus();
      await loadProjects();
      await loadContacts();
      await loadVisitorStatsForTab();
      await loadMonthlyData(currentMonthlyYear, currentMonthlyMonth);

      // 방문자 기록 초기화: 최근 30일 기본 설정
      const today = new Date();
      const thirtyDaysAgo = new Date(today);
      thirtyDaysAgo.setDate(today.getDate() - 30);

      const startDateInput = document.getElementById('visitor-start-date');
      const endDateInput = document.getElementById('visitor-end-date');

      if (startDateInput && endDateInput) {
        // YYYY-MM-DD 형식으로 변환
        const formatDate = (date) => {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        startDateInput.value = formatDate(thirtyDaysAgo);
        endDateInput.value = formatDate(today);

        // 날짜 제약 조건 적용
        updateDateConstraints();

        // 기본 날짜 범위로 방문자 목록 로드
        await loadVisitors(startDateInput.value, endDateInput.value, 'newest');
      }

      lucide.createIcons();
    })();
  </script>
